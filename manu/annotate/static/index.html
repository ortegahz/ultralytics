<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频逐帧标注工具</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">

  <aside id="sidebar-left">
    <div class="panel-head">
      <span>序列</span>
      <button id="btn-rescan" class="mini" title="重新扫描目录">重扫</button>
    </div>
    <input id="seq-search" type="search" placeholder="过滤序列…" autocomplete="off">
    <div id="seq-list" class="seq-list"></div>
  </aside>

  <main id="main">
    <div id="toolbar">
      <div class="tb-group">
        <button id="btn-prev" class="tb" title="上一帧 (A / ←)">◀</button>
        <div id="frame-readout" class="readout">
          <input id="frame-input" type="number" min="0" step="1" value="0">
          <span id="frame-total">/ 0</span>
        </div>
        <button id="btn-next" class="tb" title="下一帧 (D / →)">▶</button>
        <button id="btn-accept" class="tb primary" title="接受候选并前进 (空格)">接受候选 ⏎</button>
        <button id="btn-clear" class="tb" title="清空本帧 (Shift+Delete)">清空</button>
      </div>

      <div class="tb-group">
        <label class="chk"><input id="chk-proposals" type="checkbox" checked> 候选</label>
        <label class="slider">阈值 <input id="min-score" type="range" min="0" max="0.95" step="0.01" value="0">
          <span id="min-score-val" class="mono">0.00</span></label>
        <label class="chk"><input id="chk-fast" type="checkbox"> 快进 <input id="fast-step" type="number" min="2" max="60" value="10"></label>
        <label class="chk"><input id="chk-follow" type="checkbox"> 跟随传播</label>
        <button id="btn-zoom-out" class="tb" title="缩小 (-)">−</button>
        <button id="btn-zoom-in" class="tb" title="放大 (+)">+</button>
        <button id="btn-fit" class="tb" title="适应窗口 (0)">适应</button>
      </div>

      <div class="tb-group right">
        <button id="btn-propagate" class="tb" title="向前传播选中框 (P)">传播 ⇥</button>
        <span class="prop-n"><input id="prop-frames" type="number" min="1" max="200" value="20"> 帧</span>
        <button id="btn-interp" class="tb" title="插补到下一标注帧 (I)">插补</button>
        <button id="btn-preannot" class="tb accent" title="在训练服务器上跑多尺度 SOTA 预标注">预标注</button>
      </div>
    </div>

    <div id="viewport">
      <div id="stage">
        <canvas id="img-canvas"></canvas>
        <canvas id="box-canvas"></canvas>
      </div>
      <div id="empty-hint" class="empty">从左侧选择一个序列</div>
    </div>

    <div id="timeline-wrap">
      <canvas id="timeline"></canvas>
      <div id="timeline-cursor"></div>
    </div>
    <div id="statusbar">
      <span id="status-text">就绪</span>
      <span class="spacer"></span>
      <span id="job-text" class="mono"></span>
    </div>
  </main>

  <aside id="sidebar-right">
    <div class="panel-head"><span>当前帧</span><span id="frame-state" class="pill">—</span></div>
    <div id="frame-stats" class="stats"></div>

    <div class="panel-head"><span>框</span><span id="box-count" class="pill">0</span></div>
    <div id="box-list" class="box-list"></div>

    <div class="panel-head"><span>快捷键</span></div>
    <div class="help" id="help-body">
      <div><kbd>A</kbd>/<kbd>D</kbd> 上下帧 · <kbd>⇧</kbd>+10 帧</div>
      <div><kbd>空格</kbd> 接受候选并前进</div>
      <div><kbd>F</kbd> 跳到下一个未复核帧</div>
      <div><kbd>N</kbd> 新建框 · <kbd>Del</kbd> 删除选中</div>
      <div><kbd>P</kbd> 传播 · <kbd>I</kbd> 插补 · <kbd>C</kbd> 复制上帧</div>
      <div><kbd>[</kbd>/<kbd>]</kbd> 候选阈值 · <kbd>Tab</kbd> 显隐候选</div>
      <div><kbd>Ctrl</kbd>+<kbd>Z</kbd>/<kbd>Y</kbd> 撤销重做</div>
      <div><kbd>Home</kbd>/<kbd>End</kbd> 首末帧 · <kbd>0</kbd> 适应</div>
    </div>
  </aside>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modal-title">预标注</h3>
    <div id="modal-body" class="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="tb">关闭</button>
      <button id="modal-ok" class="tb primary">开始</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
